server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name evin.click;
    root /home/angel/evin-plataform;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/evin.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evin.click/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Cabeceras de seguridad (aplican a todo el sitio) ──────────────
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location /api {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Caché de estáticos ─────────────────────────────────────────────
    location ~* \.(css|js|jpg|jpeg|png|gif|svg|webp|woff2?|ttf|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
server {
    listen 80;
    listen [::]:80;
    server_name evin.click;
    return 301 https://$host$request_uri;
}
